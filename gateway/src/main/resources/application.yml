server:
  port: 8072

spring:
  application:
    name: gateway

  profiles:
    active: default

  config:
    import: "configserver:http://localhost:8071/"

eureka:
  instance:
    prefer-ip-address: true

  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      access: read-only

    shutdown:
      access: unrestricted

  info:
    env:
      enabled: true